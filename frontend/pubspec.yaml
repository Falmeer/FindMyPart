name: find_my_part
description: FindMyPart — Automotive Marketplace & Service Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Phone number input
  intl_phone_field: ^3.2.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # UI
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  photo_view: ^0.14.0
  lottie: ^3.1.2
  badges: ^3.1.2
  cupertino_icons: ^1.0.8

  # WebSockets / Reverb
  dart_pusher_channels: ^1.2.3

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  generate: true
